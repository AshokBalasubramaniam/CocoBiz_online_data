services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  mongo_data:
  redis_data:
