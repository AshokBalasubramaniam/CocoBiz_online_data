[package]
name = "cocobiz_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
bson = { version = "2.15.0", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mongodb = "3.9.1"
rand = "0.10.2"
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
